[project]
name = "personal-assistant-e2e"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentarts-sdk>=0.1.3",
    "chainlit>=2.11.1",
    "deepagents>=0.6.8",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.14.1",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0",
    "ruff>=0.11.0",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "feature: E2E tests for features",
    "regression: E2E regression tests for bugs",
    "slow: Tests that take longer than 5 seconds (subprocess startup)",
]
