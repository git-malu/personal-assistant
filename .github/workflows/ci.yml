name: CI

on:
  pull_request:
    paths:
      - "personal-assistant-service/**"
      - "personal-assistant-client/**"
      - "personal-assistant-e2e/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "personal-assistant-service/**"
      - "personal-assistant-client/**"
      - "personal-assistant-e2e/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/personal_assistant_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_assistant_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: personal-assistant-service/uv.lock

      - name: Install dependencies
        working-directory: personal-assistant-service
        run: uv sync --locked

      - name: Ruff check
        working-directory: personal-assistant-service
        run: uv run ruff check .

      - name: Verify database migrations
        working-directory: personal-assistant-service
        env:
          POSTGRES_DSN: ${{ env.TEST_POSTGRES_DSN }}
        run: uv run alembic upgrade head

      - name: Pytest
        working-directory: personal-assistant-service
        run: uv run pytest tests/

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-assistant-client/package-lock.json

      - name: Install dependencies
        working-directory: personal-assistant-client
        run: npm ci

      - name: Test
        working-directory: personal-assistant-client
        run: npm run test

      - name: Build
        working-directory: personal-assistant-client
        run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/personal_assistant_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_assistant_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal-assistant-client/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            personal-assistant-service/uv.lock
            personal-assistant-e2e/uv.lock

      - name: Install service dependencies
        working-directory: personal-assistant-service
        run: uv sync --locked

      - name: Install E2E dependencies
        working-directory: personal-assistant-e2e
        run: uv sync --locked

      - name: Install Playwright Chromium
        working-directory: personal-assistant-e2e
        run: uv run playwright install --with-deps chromium

      - name: Install client dependencies
        working-directory: personal-assistant-client
        run: npm ci

      - name: Ruff check
        working-directory: personal-assistant-e2e
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: personal-assistant-e2e
        run: uv run ruff format --check .

      - name: Smoke tests
        working-directory: personal-assistant-e2e
        run: uv run pytest -m smoke -q

      - name: Full-stack integration tests
        working-directory: personal-assistant-e2e
        run: uv run pytest -m full_stack -q
