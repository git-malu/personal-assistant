name: Deploy Service to AgentArts Runtime

on:
  push:
    branches: [main]
    paths:
      - "personal-assistant-service/**"
      - ".github/workflows/deploy-service-to-agentarts.yml"
  workflow_dispatch:  # 手动触发

jobs:
  migrate-database:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: personal-assistant-service/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        working-directory: personal-assistant-service
        run: uv sync --frozen --no-dev

      - name: Upgrade PostgreSQL schema
        working-directory: personal-assistant-service
        run: |
          test -n "$POSTGRES_DSN" || {
            echo "::error::POSTGRES_DSN GitHub secret is required"
            exit 1
          }
          uv run --no-dev alembic upgrade head
          uv run --no-dev alembic current --check-heads

  build-and-push:
    needs: migrate-database
    runs-on: ubuntu-24.04-arm  # GitHub 原生 ARM64 runner，无需 QEMU 模拟

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SWR login password
        run: |
          SWR_PASSWORD=$(printf "${{ secrets.HUAWEICLOUD_SDK_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.HUAWEICLOUD_SDK_SK }}" | od -An -vtx1 | tr -d ' \n')
          echo "::add-mask::$SWR_PASSWORD"
          echo "SWR_PASSWORD=$SWR_PASSWORD" >> $GITHUB_ENV

      - name: Login to SWR
        run: |
          echo "$SWR_PASSWORD" | docker login swr.cn-southwest-2.myhuaweicloud.com \
            -u "cn-southwest-2@${{ secrets.HUAWEICLOUD_SDK_AK }}" \
            --password-stdin

      - name: Compute image tags
        id: image
        run: |
          # Dynamically extract application version from pyproject.toml
          APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('personal-assistant-service/pyproject.toml', 'rb'))['project']['version'])")
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          IMAGE_BASE="swr.cn-southwest-2.myhuaweicloud.com/personal-assistant-org/agent_personal_assistant"
          
          TAG_LATEST="$IMAGE_BASE:latest"
          TAG_VERSION="$IMAGE_BASE:$APP_VERSION"
          TAG_SHA="$IMAGE_BASE:${APP_VERSION}-sha-$COMMIT_SHA"

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "tag_latest=$TAG_LATEST" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push ARM64 image
        env:
          BUILDKIT_USE_OCI_MEDIA_TYPES: "0"  # SWR 基础版不支持 OCI 格式
          TAG_LATEST: ${{ steps.image.outputs.tag_latest }}
          TAG_VERSION: ${{ steps.image.outputs.tag_version }}
          TAG_SHA: ${{ steps.image.outputs.tag_sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            --provenance=false \
            -f personal-assistant-service/Dockerfile \
            -t $TAG_LATEST \
            -t $TAG_VERSION \
            -t $TAG_SHA \
            .

          docker push $TAG_LATEST
          docker push $TAG_VERSION
          docker push $TAG_SHA

      - name: Verify image pushed
        env:
          TAG_LATEST: ${{ steps.image.outputs.tag_latest }}
          TAG_VERSION: ${{ steps.image.outputs.tag_version }}
          TAG_SHA: ${{ steps.image.outputs.tag_sha }}
        run: |
          echo "🔍 Querying remote SWR registry for immutable image manifest..."
          
          # Inspect remote manifest to confirm it exists and retrieve the image digest
          MANIFEST_INFO=$(docker manifest inspect "$TAG_SHA")
          DIGEST=$(echo "$MANIFEST_INFO" | grep -m 1 "digest" | awk -F'"' '{print $4}')
          
          echo "✅ Remote SWR verification successful!"
          echo "📦 Pushed Image (latest): $TAG_LATEST"
          echo "📦 Pushed Image (version): $TAG_VERSION"
          echo "📦 Unique Tag: $TAG_SHA"
          echo "🆔 Remote Image Digest: $DIGEST"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentArts SDK
        run: |
          pip install agentarts-sdk

      - name: Deploy to AgentArts Runtime
        env:
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
          HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
          AGENTARTS_IMAGE_URL: ${{ steps.image.outputs.tag_sha }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_CREDENTIAL_PROVIDER: ${{ vars.LLM_CREDENTIAL_PROVIDER }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          OAUTH2_CALENDAR_CALLBACK_URL: ${{ vars.OAUTH2_CALENDAR_CALLBACK_URL }}
        run: |
          cd personal-assistant-service

          for name in \
            HUAWEICLOUD_SDK_AK \
            HUAWEICLOUD_SDK_SK \
            LOG_LEVEL \
            LLM_PROVIDER \
            LLM_MODEL \
            LLM_CREDENTIAL_PROVIDER \
            POSTGRES_DSN \
            OAUTH2_CALENDAR_CALLBACK_URL \
            AGENTARTS_IMAGE_URL
          do
            test -n "$(printenv "$name")" || {
              echo "::error::$name GitHub variable or secret is required"
              exit 1
            }
          done

          # Substitute canonical Runtime settings. Secret values remain in
          # AgentArts Identity and are never injected through GitHub Actions.
          envsubst < .agentarts_config.yaml > .agentarts_config.resolved.yaml
          test -s .agentarts_config.resolved.yaml
          test -z "$(grep -o '\${[^}]*}' .agentarts_config.resolved.yaml || true)"
          grep -q '^default_agent: personal-assistant$' .agentarts_config.resolved.yaml
          grep -q '^  personal-assistant:$' .agentarts_config.resolved.yaml
          grep -q "url: $AGENTARTS_IMAGE_URL" .agentarts_config.resolved.yaml
          mv .agentarts_config.resolved.yaml .agentarts_config.yaml
          agentarts launch
