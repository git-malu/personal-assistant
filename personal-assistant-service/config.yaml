# Personal Assistant — LLM Provider 配置
# 详见 ADR-011: 多 LLM Provider 可配置架构
llm:
  default: deepseek  # 默认 provider。可选值：maas | deepseek
  providers:
    maas:
      base_url: https://api.modelarts-maas.com/openai/v1
      api_key_provider: MAAS_API_KEY
      model: deepseek-v4-pro
    deepseek:
      base_url: https://api.deepseek.com
      api_key_provider: DEEPSEEK_API_KEY
      model: deepseek-chat

identity:
  github:
    # Optional. Prefer AGENTARTS_GITHUB_OAUTH2_CALLBACK_URL for private deployments.
    oauth2_callback_url:
