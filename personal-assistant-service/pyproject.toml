[project]
name = "personal-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "deepagents>=0.6.8",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.0",
    "agentarts-sdk>=0.1.3",
    "huaweicloudsdkiam>=3.1.199",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0",
    "chainlit>=2.11.1",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "langchain-mcp-adapters>=0.3.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: service tests across modules, FastAPI app, or mocked external boundaries",
    "contract: stable API, configuration, logging, or tool schema contracts",
    "regression: service regression tests for fixed bugs",
    "slow: tests that take longer than 5 seconds",
    "postgres: tests that require a disposable PostgreSQL schema",
]

[dependency-groups]
dev = [
    "alembic>=1.14.0",
    "ruff>=0.11.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
